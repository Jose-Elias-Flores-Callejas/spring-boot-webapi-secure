name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 0 * * *'  # 20:55 America/La_Paz (UTC-4) = 00:55 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for Sonar / CodeQL history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # 3. Software Composition Analysis (SCA) - Dependency vulnerabilities
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check (strict, CVSS >= 7 fails)
        id: odccheck
        continue-on-error: true
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -Dformats=HTML,JSON,XML \
              -DsuppressionFile=dependency-check-suppressions.xml
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.xml
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. SpotBugs + PMD (static analysis, JDK 21: SpotBugs ASM compat)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 for SpotBugs
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs & PMD (strict)
        id: spotbugs
        continue-on-error: true
        run: |
          mvn -B clean compile \
              com.github.spotbugs:spotbugs-maven-plugin:check \
              org.apache.maven.plugins:maven-pmd-plugin:check
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Quality Gate: reads reports, fails on critical findings
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, sca-dependency-check, static-analysis]
    if: always()
    steps:
      - name: Download SCA report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report
          path: ./gate-reports/sca
        continue-on-error: true

      - name: Download static analysis reports
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-reports
          path: ./gate-reports/static
        continue-on-error: true

      - name: Evaluate quality gate from reports
        run: |
          python3 - <<'PY'
          import json, glob, sys, xml.etree.ElementTree as ET

          failures = []

          # 1) Dependency-Check JSON: count CVSS >= 7.0
          for f in glob.glob('./gate-reports/sca/dependency-check-report.json'):
              data = json.load(open(f))
              crit = []
              for dep in data.get('dependencies', []):
                  for v in dep.get('vulnerabilities', []) or []:
                      try:
                          score = float(v.get('cvssv3', {}).get('baseScore') or v.get('cvssv2', {}).get('score') or 0)
                      except (TypeError, ValueError):
                          score = 0
                      if score >= 7.0:
                          crit.append((dep.get('fileName'), v.get('name'), score))
              print(f'SCA: {len(crit)} hallazgos con CVSS>=7')
              for c in crit[:20]:
                  print(f'  - {c[0]} {c[1]} CVSS={c[2]}')
              if crit:
                  failures.append(f'SCA: {len(crit)} vulnerabilidades CVSS>=7')

          # 2) SpotBugs XML: high-priority bugs
          for f in glob.glob('./gate-reports/static/spotbugsXml.xml'):
              root = ET.parse(f).getroot()
              bugs = root.findall('BugInstance')
              high = [b for b in bugs if b.get('priority') == '1']
              print(f'SpotBugs: {len(bugs)} bugs totales, {len(high)} prioridad alta')
              if high:
                  failures.append(f'SpotBugs: {len(high)} bugs de prioridad alta')

          # 3) Previous job results (build/tests/SAST/SCA/static)
          import os
          for name, res in {
              'build-and-test': '${{ needs.build-and-test.result }}',
              'sast-codeql': '${{ needs.sast-codeql.result }}',
              'sca-dependency-check': '${{ needs.sca-dependency-check.result }}',
              'static-analysis': '${{ needs.static-analysis.result }}',
          }.items():
              print(f'{name}: {res}')
          if '${{ needs.build-and-test.result }}' == 'failure':
              failures.append('Build o tests fallaron')

          if failures:
              print('::error::Quality gate FAILED:')
              for f_ in failures:
                  print(f'::error::{f_}')
              sys.exit(1)
          print('Quality gate passed: sin hallazgos criticos en reportes')
          PY